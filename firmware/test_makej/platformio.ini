; test_makej - zalozeno na testing_firmware (T08), ale bez interaktivnich
; promptu: motor, pocet kroku, rychlost a proud jsou pevne dane konstanty
; v src/main.cpp, posuvny registr se inicializuje primo hodnotou SHIFT_REG_VALUE.
;
;   ../flash.sh -d .            # build + kontrola flash + zapis
;   ../flash.sh -d . --check    # jen diagnostika, nic nezapisuje
;   pio device monitor
;
; "pio run -t upload" NE - stejna past jako u testing_firmware, viz ../FLASH.md.

[platformio]
default_envs = test_makej

[env:test_makej]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Stejna pametova konfigurace jako testing_firmware/platformio.ini - viz tam
; komentar, proc presne tyhle ctyri hodnoty (deska ESP32-S3-WROOM-2 N32R16V).
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-I include
	-Wall

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
