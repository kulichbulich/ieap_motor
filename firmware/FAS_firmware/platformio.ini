; PlatformIO projekt - FAS firmware (ESP32-S3-WROOM-2 N32R16V)
; Deska: PCB/esp32stepper.kicad_pro
;
; Nejjednodussi aplikacni firmware desky: jeden motor jede porad dokola otacku
; tam a otacku zpet. Nic se neovlada z konzole, vsechna nastaveni jsou
; v include/fas_config.h. Interaktivni ladeni proudu a rychlosti patri do
; ../testing_firmware (test T09).
;
; Nahravani (esptool v PlatformIO na teto desce pada na BrokenPipeError,
; proto skript s vlastnim esptoolem 5.3.1+):
;
;   ../flash.sh -d .            # build + kontrola flash + zapis
;   ../flash.sh -d . --check    # jen diagnostika, nic nezapisuje
;   pio device monitor -d .     # konzole
;
; Postup i rucni varianta jsou v ../FLASH.md, tri pasti, ktere stoji hodiny,
; v ../report.md.

[platformio]
default_envs = fas

[env:fas]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Oktalni flash + oktalni PSRAM podle potvrzene varianty modulu N32R16V
; (32 MB OPI flash + 16 MB OPI PSRAM, obe na 1V8; souhlasi s efuse).
;
; Tohle NENI kosmetika, plati to na obe strany:
;   - quad konfigurace na tomto oktalnim modulu NENABOOTUJE - ROM podle efuse
;     zapne OPI a aplikace spadne na
;       assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
;     ve smycce resetu.
;   - a naopak binarku s opi_opi nenos na DevKitC-1 N8R2, tam skonci na
;       E cpu_start: Octal Flash option selected, but EFUSE not configured!
;
; flash_mode je zamerne dout, ne opi: 1. ani 2. bootloader OPI neumi, zavadi se
; v DOUT a ROM rezim nahradi podle efuse.
;
; default_32MB.csv ve frameworku neexistuje; default_16MB.csv na 32MB cipu jede
; (nevyuzije zbytek). Tenhle firmware ma pod 400 kB, misto je jedno.
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

; Konzole pres nativni USB (IO19/IO20 -> USB1 na desce). Na desce neni
; USB-UART prevodnik, UART0 (IO43/IO44) neni zapojen.
;
; Serial1 je obsazena jednodratovou UART sbernici driveru (IO17/IO18), takze
; na konzoli se pouziva jen Serial (USB CDC).
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; bez tohohle Arduino oktalni PSRAM neinicializuje; tenhle firmware ji
	; nepotrebuje, ale memory_type = opi_opi ji uz stejne predpoklada
	-DBOARD_HAS_PSRAM
	-I include
	-Wall

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
