; ---------------------------------------------------------------------------
; blink_nonOctal - stejny blikaci test jako ../blink, ale pro obycejny
; ESP32-S3-DevKitC-1 s modulem WROOM-1, tedy quad flash a zadna oktalni pamet.
;
; Proti ../blink tady schvalne NENI cely blok nastaveni pameti (flash_size,
; partitions, flash_mode, memory_type). Neni to opomenuti: definice desky
; esp32-s3-devkitc-1 uz sama znamena 8 MB QIO flash, default_8MB.csv a
; memory_type qio_qspi bez PSRAM - presne to, co WROOM-1 chce. Prenest sem
; opi_opi z ../blink by skoncilo abort() hned pri startu.
;
; Kdyby na devkitu byl modul s vic flash (N16R8), 8 MB konfigurace na nem bezi
; taky, jen se zbytek nevyuzije. PSRAM se nezapina vubec, takze je jedno,
; jestli ji modul ma a jaka je.
;
; Nahravani - tady staci bezny upload, ../flash.sh NE: ten je napsany pro
; desku esp32stepper (hleda /dev/ttyACM*, resetuje pres --before usb-reset,
; ceka flash od Macronixu), coz na prevodniku devkitu neplati.
;   pio run -t upload
;   pio run -t upload --upload-port /dev/ttyUSB0   ; kdyz jsou zapojene oba USB
;
; Oba konektory devkitu flashuji bez mackani BOOT/RESET:
;   USB  (nativni, IO19/IO20)  -> /dev/ttyACM*   reset dela ROM USB-Serial/JTAG
;   UART (CP2102/CH340)        -> /dev/ttyUSB*   reset dela DTR/RTS prevodniku
; Aby to platilo porad, firmware do USB nesmi zasahovat: zadne ARDUINO_USB_*
; flagy (z definice desky plati ARDUINO_USB_MODE=1 a CDC_ON_BOOT=0, tedy
; nativni USB zustava hardwarove CDC/JTAG z ROM) a sketch nesaha na IO19/IO20.
; ---------------------------------------------------------------------------

[platformio]
default_envs = blink_nonoctal

[env:blink_nonoctal]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
