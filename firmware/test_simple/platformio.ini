; ---------------------------------------------------------------------------
; test_simple - nejjednodussi mozny "zije to?" test pro ESP32-S3-WROOM-2
;
; Zamerne oddeleny projekt od firmware/testing_firmware/. Zadne knihovny,
; zadny testkit, zadny registr testu, zadne sahani na GPIO desky - jen
; setup() + loop(), ktere porad dokola tisknou, ze cip bezi.
;
; Vystup jde SOUCASNE na dve rozhrani, takze se nemusi prekladat znovu podle
; toho, cim se clovek zrovna diva:
;   1) nativni USB CDC (IO19/IO20 -> konektor USB1 na desce)
;   2) hardwarovy UART pro externi FTDI (piny podle prostredi, viz nize)
;
; Pouziti:
;   pio run -e usb_j5   -t upload && pio device monitor   ; FTDI na list J5
;   pio run -e usb_gpio -t upload                         ; FTDI dratem na modul
;
; Nahravat lze pres nativni USB (bootloader se prihlasi jako USB-serial/JTAG,
; pripadne drz BOOT a cvakni RESET). Pri nahravani pres FTDI je potreba mit
; drat i na EN a IO0, jinak se deska musi do bootloaderu uvest rucne.
;
; ---------------------------------------------------------------------------
; POZOR: "pio run -t upload" na teto desce nespolehlive selhava. PlatformIO
; ma zabudovany esptool 4.5.1 (tool-esptoolpy 1.40501.0), ktery na oktalni
; flash pres nativni USB-Serial/JTAG pada na
;   BrokenPipeError: [Errno 32] Broken pipe
; jakmile se cip zaroven resetuje (napr. kdyz je v boot loopu). Samostatny
; esptool 5.3.1 se pripoji bez problemu.
;
; Proto se nahrava POSTAVENYM buildem + samostatnym esptoolem:
;   python3 -m venv ~/venv-esptool && ~/venv-esptool/bin/pip install esptool
;   pio run -e usb_j5                      # jen build, BEZ -t upload
;   ~/venv-esptool/bin/python -m esptool --port /dev/ttyACM0 --baud 460800 \
;       --before usb-reset --connect-attempts 5 \
;       write-flash --flash-mode keep --flash-freq keep --flash-size keep \
;       0x0     .pio/build/usb_j5/bootloader.bin \
;       0x8000  .pio/build/usb_j5/partitions.bin \
;       0xe000  ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
;       0x10000 .pio/build/usb_j5/firmware.bin
; ("keep" u vsech tri parametru je dulezite - necha hlavicku z buildu byt,
; aby ji esptool neprepsal na jinou velikost/rezim flash.)
;
; Dalsi dve pasti, ktere uz stalo hodiny (2026-07-29/30):
;
; 1) Flash zaseknuta v OPI rezimu. Reset pres EN neresetuje flash die, takze
;    kdyz v ni zustane OPI rezim, ROM ji neprecte a esptool hlasi
;    "Failed to communicate with the flash chip" + Manufacturer: 00. Pomuze
;    JEDINE uplne odpojeni napajeni. Deska umi jet i z 24 V barrel jacku, tak
;    odpoj USB i barrel jack a pockej ~10 s.
;
; 2) Block-protect bity ve flash. Pokud "flash_id" vraci spravne C2/8039/32MB,
;    ale zapis tise selze ("MD5 of file does not match" nebo "the written
;    flash region is empty") a chip erase "uspeje" za 0,6 s, jsou nastavene
;    BP bity ve status registru MX25UM25645G. Datasheet: pri zapisu do
;    chranene oblasti se instrukce IGNORUJE, a CE jde provest jen pri
;    BP3:BP0 = 0. Kontrola a naprava:
;      esptool --port /dev/ttyACM0 read-flash-status --bytes 1     # 0xb0 = BP3,BP2 set
;      esptool --port /dev/ttyACM0 write-flash-status --bytes 1 --non-volatile 0x00
;    Zamerne --bytes 1: WRSR bere 8 nebo 16 bitu a jen 8bitova forma necha
;    konfiguracni registr (dummy cycles, ODS) netknuty. OTP bit WPSEL se timto
;    nastavit neda, ten ma jiny opcode (68h), takze je to bezpecne a vratne.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------

[platformio]
default_envs = usb_j5

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Varianta modulu je potvrzena: ESP32-S3-WROOM-2 N32R16V, tedy 32 MB oktalni
; (OPI) flash + 16 MB oktalni PSRAM, obe na 1V8. Souhlasi to i s efuse na cipu:
; FLASH_TYPE = 8 data lines, VDD_SPI = 1.8V LDO, PSRAM_CAP = 16M, AP_1v8.
;
; Quad konfigurace tady NEfunguje, i kdyz to tvrdi README v testing_firmware:
; ROM podle efuse zapne OPI ("Octal Flash Mode Enabled") a aplikace prelozena
; pro quad pak spadne na "assert failed: do_core_init startup.c:328
; (flash_ret == ESP_OK)" a deska se resetuje ve smycce.
;
; flash_mode je zamerne dout, ne opi: 1. ani 2. bootloader OPI neumi, takze se
; zavadi v DOUT a ROM rezim nahradi podle efuse. Stejne to ma i board def
; esp32s3camlcd, ktery je v platformu jediny s opi_opi.
;
; default_32MB.csv ve frameworku neexistuje, default_16MB.csv na 32MB cipu jede
; (jen nevyuzije zbytek); pro vic prostoru je k dispozici large_littlefs_32MB.csv.
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; FTDI na debug listu J5 na desce (IO2 = TX, IO1 = RX) - vychozi.
; Zapojeni: J5.2 (IO2) -> RX na FTDI, J5.3 (IO1) -> TX na FTDI, GND na GND.
; FTDI musi byt 3V3! 5V variantou se cip poskodi.
; ---------------------------------------------------------------------------
[env:usb_j5]
build_flags =
	${env.build_flags}
	-DDBG_UART_TX=2
	-DDBG_UART_RX=1

; ---------------------------------------------------------------------------
; FTDI napajeny dratem primo na modul - UART0 (IO43 = TXD0, IO44 = RXD0).
; Tyhle piny na desce nikam nevedou, takze se na ne musi pajet primo na
; pouzdro WROOM-2. Vyhoda: je to defaultni UART, na kterem mluvi i ROM
; bootloader, takze pres nej jde i nahravat.
; ---------------------------------------------------------------------------
[env:usb_gpio]
build_flags =
	${env.build_flags}
	-DDBG_UART_TX=43
	-DDBG_UART_RX=44

; Konzervativne - na letecich dratech pajenych na modul vyssi rychlost pada.
; FTDI nema drat na EN/IO0, takze se do bootloaderu musi rucne:
; drz BOOT1, cvakni reset na J1, pust BOOT1, teprve pak spust upload.
upload_speed = 115200
