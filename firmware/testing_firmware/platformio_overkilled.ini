; PlatformIO project - esp32stepper bring-up test suite (ESP32-S3-WROOM-2)
; Deska: PCB/esp32stepper.kicad_pro
;
; Cilem repa zatim NENI aplikacni firmware, ale sada systematickych testu
; hardwaru. Kazdy test je jedna funkce v src/tests/. Prepina se volbou
; prostredi:
;
;   pio run -e menu -t upload && pio device monitor
;       nahraje vsechny testy najednou, vyber se dela z konzole - bezne
;       pouzivany rezim, deska se neprogramuje mezi testy
;
;   pio run -e t00_chip_info -t upload && pio device monitor
;       nahraje jediny test; hodi se, kdyz deska tuhne a je potreba mit
;       v binarce co nejmene kodu
;
; Pozn. k variante modulu: JE POTVRZENA (2026-07-30). U1 je ESP32-S3-WROOM-2
; N32R16V, tedy 32 MB oktalni (OPI) flash + 16 MB oktalni PSRAM, obe na 1V8.
; Souhlasi to s efuse na cipu: FLASH_TYPE = 8 data lines, VDD_SPI = 1.8V LDO,
; PSRAM_CAP = 16M, PSRAM_VENDOR = AP_1v8. Konfigurace nize je proto oktalni.
; Skutecnou velikost flash a pritomnost PSRAM vypise test t00_chip_info.
;
; POZOR: "pio run -t upload" na teto desce nespolehlive selhava - esptool 4.5.1
; zabudovany v PlatformIO pada na BrokenPipeError. Nahrava se samostatnym
; esptoolem 5.3.1+, na to je skript, ktery si vsechno potrebne obstara sam:
;
;   ../flash.sh -d .                 # build + kontrola flash + zapis
;   ../flash.sh -d . -e t01_blink_io38
;   ../flash.sh -d . --check         # jen diagnostika, nic nezapisuje
;
; Postup i rucni varianta jsou v ../FLASH.md, tri pasti, ktere stoji hodiny,
; v ../report.md.

[platformio]
default_envs = menu

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Oktalni flash + oktalni PSRAM, podle potvrzene varianty N32R16V.
;
; POZOR na obe strany te mince:
;   - Binarka s flash_mode = opi na modulu s QUAD flash hlasi
;       E cpu_start: Octal Flash option selected, but EFUSE not configured!
;     zavola abort() a deska se restartuje ve smycce. Proto tuhle konfiguraci
;     NENOS na ESP32-S3-DevKitC-1 N8R2, na kterem se odladily T00 a T01.
;   - Obracene to plati taky, a driv se tu tvrdilo, ze ne: quad konfigurace na
;     TOMTO oktalnim modulu NENABOOTUJE. ROM podle efuse zapne OPI ("Octal
;     Flash Mode Enabled") a aplikace prelozena pro quad spadne na
;       assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
;     a deska se resetuje ve smycce. Overeno 2026-07-30 na realne desce.
;
; flash_mode je zamerne dout, ne opi: 1. ani 2. bootloader OPI neumi, zavadi
; se v DOUT a ROM rezim nahradi podle efuse. Stejne to ma i board def
; esp32s3camlcd, jediny v platformu s opi_opi.
;
; default_32MB.csv ve frameworku neexistuje; default_16MB.csv na 32MB cipu jede
; (nevyuzije zbytek), pro vic prostoru je large_littlefs_32MB.csv.
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

; Konzole pres nativni USB (IO19/IO20 -> USB1 na desce).
; Na desce neni USB-UART prevodnik, UART0 (IO43/IO44) neni zapojen.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; bez tohohle Arduino PSRAM neinicializuje a t00 ji nenajde ani kdyz je
	-DBOARD_HAS_PSRAM
	-I include
	-Wall

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; Vychozi prostredi: vsechny testy + menu na konzoli.
; ---------------------------------------------------------------------------
[env:menu]
; backup_direct/ je v koreni repa, tedy mimo tenhle projekt - PlatformIO ho
; nevidi. Vyjimka je tu pro pripad, ze by nekdo zalozil backup_direct primo
; v src/; jinak by se stare kopie testu prelozily podruhe (duplicitni symboly).
build_src_filter = +<*> -<backup_direct/>

; ---------------------------------------------------------------------------
; Jednoucelova prostredi - jeden test na binarku.
; Pri pridani testu do src/tests/ pridej i sekci sem a radek do
; src/test_registry.cpp.
; ---------------------------------------------------------------------------
[env:t00_chip_info]
build_src_filter = -<*> +<main.cpp> +<tests/t00_chip_info.cpp>
build_flags = ${env.build_flags} -DTEST_ENTRY=t00_chip_info

[env:t01_blink_io38]
build_src_filter = -<*> +<main.cpp> +<tests/t01_blink_io38.cpp>
build_flags = ${env.build_flags} -DTEST_ENTRY=t01_blink_io38

[env:t02_shift_register]
build_src_filter = -<*> +<main.cpp> +<tests/t02_shift_register.cpp>
build_flags = ${env.build_flags} -DTEST_ENTRY=t02_shift_register

