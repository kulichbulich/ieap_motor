; esp32stepper - bring-up testy (ESP32-S3-WROOM-2 N32R16V, PCB/esp32stepper.kicad_pro)
;
; Jedno prostredi: vsech 10 testu v jedne binarce, vyber z menu na konzoli.
;   ../flash.sh -d .            # build + kontrola flash + zapis
;   ../flash.sh -d . --check    # jen diagnostika, nic nezapisuje
;   pio device monitor
;
; "pio run -t upload" NE - esptool 4.5.1 v PlatformIO na teto desce pada na
; BrokenPipeError. Podrobnosti a pasti, ktere stoji hodiny, jsou v ../FLASH.md.

[platformio]
default_envs = menu

[env:menu]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Oktalni flash + oktalni PSRAM (32 MB OPI + 16 MB OPI na 1V8, dle efuse).
; Nevolitelne v obou smerech: ROM podle efuse zapne OPI, takze quad binarka na
; tomhle modulu spadne na "assert failed: do_core_init startup.c:328" ve smycce;
; obracene opi_opi na quad modulu (DevKitC-1 N8R2) zavola abort().
; flash_mode je zamerne dout, ne opi - bootloader OPI neumi, zavadi se v DOUT
; a ROM rezim nahradi podle efuse.
; t05_i2c_scan potrebuje Wire. Je soucasti frameworku, ale LDF v rezimu chain
; ji sam nezaradi a preklad padne na "fatal error: Wire.h: No such file".
lib_deps = Wire

board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

; Konzole je nativni USB (IO19/IO20 -> USB1); USB-UART prevodnik na desce neni.
; ARDUINO_USB_MODE=1 uz plati z definice desky. Bez BOARD_HAS_PSRAM Arduino
; PSRAM neinicializuje a t00 ji nenajde ani kdyz tam je.
; "-I include" vypadá zbytecne (PlatformIO ho dava na cestu automaticky), ale
; plati to jen pro src/ - knihovny v lib/ ho nevidi a testkit.h nenajde
; board_pins.h. Bez nej se to neprelozi.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-I include
	-Wall

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
