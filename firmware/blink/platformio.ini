; ---------------------------------------------------------------------------
; blink - nejjednodussi mozny blikaci test pro ESP32-S3-WROOM-2.
;
; Deli jedinou vec: blika na IO38. Zadna konzole, zadne menu, zadny testkit,
; zadna dalsi periferie. Pouziva se, kdyz je potreba mit v binarce absolutni
; minimum kodu a jen ocima potvrdit, ze cip bezi a prepina GPIO.
;
; Na desce NENI softwarove riditelna LED (LED1 visi na PG vystupu LT8610 pres
; NPN1), takze LED + ~330R je potreba pripojit externe mezi J4 (IO38) a GND.
;
; Pouziti:
;   ../flash.sh -d .            ; build + kontrola flash + zapis
;   ../flash.sh -d . --check    ; jen diagnostika, nic nezapisuje
;
; Nahravat pres "pio run -t upload" NE - esptool 4.5.1 zabudovany v PlatformIO
; na teto desce pada na BrokenPipeError. flash.sh si samostatny esptool 5.3.1+
; najde nebo doinstaluje sam. Rucni postup a tri pasti, ktere stoji hodiny
; (flash zaseknuta v OPI, block-protect bity, quad konfigurace na oktalnim
; modulu), jsou v ../FLASH.md a ../report.md.
; ---------------------------------------------------------------------------

[platformio]
default_envs = blink

[env:blink]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Oktalni flash + oktalni PSRAM, podle potvrzene varianty modulu N32R16V
; (32 MB OPI flash + 16 MB OPI PSRAM, obe na 1V8; souhlasi s efuse na cipu).
;
; Tohle NENI volitelne ani pro takhle maly firmware: ROM podle efuse zapne OPI
; a aplikace prelozena pro quad spadne na
;   assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
; a deska se resetuje ve smycce. Obracene binarka s opi_opi na quad modulu
; (napr. DevKitC-1 N8R2) zavola abort() - tuhle konfiguraci tam nenos.
;
; flash_mode je zamerne dout, ne opi: 1. ani 2. bootloader OPI neumi, zavadi se
; v DOUT a ROM rezim nahradi podle efuse.
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi

; Firmware nic netiskne, ale nativni USB CDC se necha nabehnout schvalne:
; deska se pak porad hlasi jako /dev/ttyACM* a flash.sh ji umi resetovat do
; bootloaderu (--before usb-reset) bez mackani BOOT/RESET.
;build_flags =
	;-DARDUINO_USB_MODE=1
	;-DARDUINO_USB_CDC_ON_BOOT=1
	;-Wall
